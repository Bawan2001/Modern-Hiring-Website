<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard | JobSphere</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <header class="navbar">
        <div class="container">
            <a href="/" class="logo">Job<span>Sphere</span></a>
            <nav>
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="/ats">ATS Checker</a></li>
                    <li><a href="/dashboard" class="active">My Dashboard</a></li>
                    {% if user.role == 'admin' %}
                    <li><a href="/admin">Admin Hub</a></li>
                    {% endif %}
                    <li><a href="/logout">Logout</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="page-content">
        <div class="container">
            <div class="section-header">
                <h1>My <span>Applications</span></h1>
                <p>Track the status of your job applications</p>
            </div>

            <div class="dashboard-grid">
                <div class="stats-cards">
                    <div class="stat-card">
                        <h3>Applied</h3>
                        <span id="stat-total">0</span>
                    </div>
                    <div class="stat-card">
                        <h3>Interviewing</h3>
                        <span id="stat-interview">0</span>
                    </div>
                    <div class="stat-card">
                        <h3>Offers</h3>
                        <span id="stat-offer">0</span>
                    </div>
                </div>

                <div class="applications-list" id="my-applications">
                    <!-- Loaded via JS -->
                    <div class="loader"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
