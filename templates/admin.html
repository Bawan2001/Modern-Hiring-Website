<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | JobSphere</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <header class="navbar">
        <div class="container">
            <a href="/" class="logo">Job<span>Sphere</span></a>
            <nav>
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="/ats">ATS Checker</a></li>
                    <li><a href="/admin" class="active">Admin Hub</a></li>
                    <li><a href="/logout">Logout</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="page-content">
        <div class="container">
            <div class="admin-grid">
                <aside class="admin-sidebar">
                    <div class="profile-card">
                        <div class="avatar">A</div>
                        <h4>{{ user.name }}</h4>
                        <span class="badge">Admin Access</span>
                    </div>
                    <ul class="admin-nav">
                        <li class="active"><a href="#">Manage Jobs</a></li>
                        <li><a href="#">Applications</a></li>
                        <li><a href="#">Settings</a></li>
                    </ul>
                </aside>

                <div class="admin-main">
                    <div class="action-bar">
                        <h2>Manage Job Listings</h2>
                        <button class="btn-primary" id="add-job-trigger">Add New Job</button>
                    </div>

                    <div class="admin-table-container">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>Title</th>
                                    <th>Company</th>
                                    <th>Location</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="admin-jobs-list">
                                <!-- Loaded via JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal for adding job -->
    <div id="job-modal" class="modal">
        <div class="modal-content">
            <h3>Post a New Position</h3>
            <form id="add-job-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Job Title</label>
                        <input type="text" id="title" required>
                    </div>
                    <div class="form-group">
                        <label>Company</label>
                        <input type="text" id="company" required>
                    </div>
                    <div class="form-group">
                        <label>Location</label>
                        <input type="text" id="location" required>
                    </div>
                    <div class="form-group">
                        <label>Salary Range</label>
                        <input type="text" id="salary" placeholder="e.g. $100k - $120k">
                    </div>
                    <div class="form-group">
                        <label>Work Type</label>
                        <select id="type">
                            <option value="Full-time">Full-time</option>
                            <option value="Part-time">Part-time</option>
                            <option value="Contract">Contract</option>
                            <option value="Remote">Remote</option>
                        </select>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" id="close-modal">Cancel</button>
                    <button type="submit" class="btn-primary">Post Opportunity</button>
                </div>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
